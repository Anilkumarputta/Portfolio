<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .circle {
      stroke-dasharray: 352;
      stroke-dashoffset: 352;
      animation: draw 2s ease-out forwards;
    }
    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }
    .pulse {
      animation: pulse 1.5s infinite alternate;
    }
    @keyframes pulse {
      0% { fill: #17072b; }
      100% { fill: #9067c6; }
    }
    .letter {
      opacity: 0;
      animation: fadeIn 1.2s 1.2s forwards;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
  <circle class="circle pulse" cx="60" cy="60" r="56" stroke="#cac4ce" stroke-width="8" fill="#17072b"/>
  <text class="letter" x="50%" y="50%" text-anchor="middle" dy=".35em" font-size="64" font-family="Arial, Helvetica, sans-serif" fill="#f7ece1" font-weight="bold">P</text>
</svg>
